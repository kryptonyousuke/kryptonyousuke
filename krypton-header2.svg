<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <!-- Dark Gothic Emo Animated Gradient -->
    <linearGradient id="vampGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033">
        <animate attributeName="stop-color" values="#FF0033;#8000FF;#FF0055;#FF0033" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5B0060">
        <animate attributeName="stop-color" values="#5B0060;#990000;#5B0060" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#990000">
        <animate attributeName="stop-color" values="#990000;#FF0055;#8000FF;#990000" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="gothicText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#700020"/>
    </linearGradient>

    <linearGradient id="gothicBadgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 0, 51, 0.25)"/>
      <stop offset="100%" stop-color="rgba(128, 0, 255, 0.25)"/>
    </linearGradient>

    <!-- Gradient para o Feixe de Varredura Scanline -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF0055" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8000FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Post-Processing Glow Filters -->
    <filter id="bloodGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Gothic HUD Grid Pattern -->
    <pattern id="gothicGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 H 0 V 30" fill="none" stroke="#FFFFFF" opacity="0.02"/>
      <path d="M 0 0 L 30 30" fill="none" stroke="#FF0033" opacity="0.04"/>
      <circle cx="30" cy="30" r="1" fill="#FF0055" opacity="0.15"/>
    </pattern>

    <style>
      /* Revelação do Frame */
      @keyframes expand {
        0% { clip-path: polygon(50% -50%, 50% -50%, 50% 150%, 50% 150%); }
        100% { clip-path: polygon(-20% -50%, 120% -50%, 120% 150%, -20% 150%); }
      }
      .expand-wrapper {
        animation: expand 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Desenho Neon Moldura */
      @keyframes drawLine {
        from { stroke-dashoffset: 600; }
        to { stroke-dashoffset: 0; }
      }
      .glowing-path {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawLine 2.5s ease-out forwards;
      }

      /* Linhas de Dados e Transmissão de Pacotes Fotônicos */
      @keyframes dashMove {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }
      .data-line {
        animation: dashMove 2s linear infinite;
      }

      @keyframes laserStream {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }
      .laser-packet {
        stroke-dasharray: 50, 250;
        animation: laserStream 3s linear infinite;
      }

      /* Entrada Sequencial de Textos */
      @keyframes slideUp {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .t1 { opacity: 0; animation: slideUp 0.8s ease-out 1.0s forwards; }
      .t2 { opacity: 0; animation: slideUp 0.8s ease-out 1.2s forwards; }
      .t3 { opacity: 0; animation: slideUp 0.8s ease-out 1.4s forwards; }
      .t4 { opacity: 0; animation: slideUp 0.8s ease-out 1.6s forwards; }
      .t5 { opacity: 0; animation: slideUp 0.8s ease-out 1.8s forwards; }
      .t6 { opacity: 0; animation: slideUp 0.8s ease-out 2.0s forwards; }

      /* Rotação das Teias de Aranha no Fundo */
      @keyframes rotateWebCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateWebCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      .web-rotate-cw {
        transform-box: fill-box;
        transform-origin: 320px 130px;
        animation: rotateWebCW 60s linear infinite;
      }
      .web-rotate-ccw {
        transform-box: fill-box;
        transform-origin: 680px 130px;
        animation: rotateWebCCW 75s linear infinite;
      }

      /* Sincronização da Aranha Direita e da Teia */
      @keyframes spiderClimbRight {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        25% { transform: rotate(6deg) translateY(26px); }
        50% { transform: rotate(-4deg) translateY(6.5px); }
        75% { transform: rotate(8deg) translateY(32.5px); }
      }
      @keyframes threadScaleRight {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        25% { transform: rotate(6deg) scaleY(1.4); }
        50% { transform: rotate(-4deg) scaleY(1.1); }
        75% { transform: rotate(8deg) scaleY(1.5); }
      }
      .spider-hanging {
        transform-origin: 860px 10px;
        animation: spiderClimbRight 8s ease-in-out infinite;
      }
      .thread-right {
        transform-origin: 860px 10px;
        animation: threadScaleRight 8s ease-in-out infinite;
      }

      /* Sincronização da Aranha Esquerda e da Teia */
      @keyframes spiderClimbLeft {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        35% { transform: rotate(-7deg) translateY(18px); }
        70% { transform: rotate(5deg) translateY(-8px); }
      }
      @keyframes threadScaleLeft {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        35% { transform: rotate(-7deg) scaleY(1.45); }
        70% { transform: rotate(5deg) scaleY(0.8); }
      }
      .spider-hanging-left {
        transform-origin: 140px 10px;
        animation: spiderClimbLeft 6.5s ease-in-out infinite;
      }
      .thread-left {
        transform-origin: 140px 10px;
        animation: threadScaleLeft 6.5s ease-in-out infinite;
      }

      /* Pulso dos Nós Radiais */
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.7; filter: drop-shadow(0 0 2px #FF0033); }
        50% { transform: scale(1.45); opacity: 1; filter: drop-shadow(0 0 10px #8000FF); }
      }
      .node {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseNode 2s ease-in-out infinite;
      }

      /* Glitch Periódico no Título Principal */
      @keyframes glitchTitle {
        0%, 91%, 100% { transform: translate(0, 0); }
        92% { transform: translate(-2px, 1px); filter: drop-shadow(2px -1px #FF0055); }
        94% { transform: translate(2px, -1px); filter: drop-shadow(-2px 1px #8000FF); }
        96% { transform: translate(-1px, 2px); }
        98% { transform: translate(0, 0); }
      }
      .title-glitch {
        animation: glitchTitle 6s ease-in-out infinite;
      }

      /* Varredura Laser Scanline */
      @keyframes scanlineSweep {
        0% { transform: translateY(-30px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(270px); opacity: 0; }
      }
      .scanline-beam {
        animation: scanlineSweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Terminal Cursor Blink */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor-blink { animation: blink 0.8s step-end infinite; }
    </style>
  </defs>

  <g class="expand-wrapper">
    <!-- Frame Principal Chanfrado (Fundo Físico) -->
    <path d="M 35 10 H 965 L 990 35 V 225 L 965 250 H 35 L 10 225 V 35 Z" fill="#050208" stroke="#1F0824" stroke-width="1.5"/>
    <path d="M 37 12 H 963 L 988 37 V 223 L 963 248 H 37 L 12 223 V 37 Z" fill="url(#gothicGrid)"/>

    <!-- Feixe Cyber Scanline de Varredura Vertical -->
    <rect class="scanline-beam" x="12" y="0" width="976" height="15" fill="url(#scanlineGrad)" pointer-events="none"/>

    <!-- Moldura Interna Secundária -->
    <path d="M 42 20 H 958 L 980 42 V 218 L 958 240 H 42 L 20 218 V 42 Z" fill="none" stroke="#330A2E" stroke-width="1" opacity="0.6"/>

    <!-- Linhas de Telemetria e Pacotes Fotônicos -->
    <line class="data-line" x1="40" y1="75" x2="960" y2="75" stroke="url(#vampGlow)" stroke-width="1.2" stroke-dasharray="4,10" opacity="0.3"/>
    <line class="laser-packet" x1="40" y1="75" x2="960" y2="75" stroke="#FF0055" stroke-width="1.8" filter="url(#bloodGlow)"/>

    <line class="data-line" x1="40" y1="185" x2="960" y2="185" stroke="url(#vampGlow)" stroke-width="1.2" stroke-dasharray="4,10" opacity="0.3"/>
    <line class="laser-packet" x1="960" y1="185" x2="40" y2="185" stroke="#8000FF" stroke-width="1.8" filter="url(#bloodGlow)"/>

    <!-- GEOMETRIAS DE TEIA DE ARANHA -->
    <g class="web-rotate-cw" stroke="url(#vampGlow)" stroke-width="1.2" fill="none" opacity="0.32">
      <line x1="320" y1="130" x2="170" y2="20"/><line x1="320" y1="130" x2="320" y2="10"/><line x1="320" y1="130" x2="470" y2="20"/>
      <line x1="320" y1="130" x2="500" y2="130"/><line x1="320" y1="130" x2="470" y2="240"/><line x1="320" y1="130" x2="320" y2="250"/>
      <line x1="320" y1="130" x2="170" y2="240"/><line x1="320" y1="130" x2="140" y2="130"/>
      <polygon points="320,100 362,107 375,130 362,153 320,160 278,153 265,130 278,107"/>
      <polygon points="320,70 390,82 410,130 390,178 320,190 250,178 230,130 250,82"/>
      <polygon points="320,40 418,57 445,130 418,203 320,220 222,203 195,130 222,57"/>
      <polygon points="320,10 446,32 480,130 446,228 320,250 194,228 160,130 194,32"/>
    </g>

    <g class="web-rotate-ccw" stroke="url(#vampGlow)" stroke-width="1.2" fill="none" opacity="0.28">
      <line x1="680" y1="130" x2="530" y2="20"/><line x1="680" y1="130" x2="680" y2="10"/><line x1="680" y1="130" x2="830" y2="20"/>
      <line x1="680" y1="130" x2="860" y2="130"/><line x1="680" y1="130" x2="830" y2="240"/><line x1="680" y1="130" x2="680" y2="250"/>
      <line x1="680" y1="130" x2="530" y2="240"/><line x1="680" y1="130" x2="500" y2="130"/>
      <polygon points="680,100 722,107 735,130 722,153 680,160 638,153 625,130 638,107"/>
      <polygon points="680,70 750,82 770,130 750,178 680,190 610,178 590,130 610,82"/>
      <polygon points="680,40 778,57 805,130 778,203 680,220 582,203 555,130 582,57"/>
      <polygon points="680,10 806,32 840,130 806,228 680,250 554,228 520,130 554,32"/>
    </g>

    <path d="M 320 130 L 500 130 L 680 130" stroke="#FF0055" stroke-width="0.9" stroke-dasharray="3,6" opacity="0.4"/>
    <path d="M 445 130 L 500 20 L 555 130" stroke="#8000FF" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.35" fill="none"/>
    <path d="M 445 130 L 500 240 L 555 130" stroke="#8000FF" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.35" fill="none"/>

    <!-- Bordas Cortadas Neon Destaque -->
    <path class="glowing-path" d="M 10 75 V 35 L 35 10 H 260" fill="none" stroke="url(#vampGlow)" stroke-width="2.5" filter="url(#bloodGlow)" stroke-linecap="round"/>
    <path class="glowing-path" d="M 990 185 V 225 L 965 250 H 740" fill="none" stroke="url(#vampGlow)" stroke-width="2.5" filter="url(#bloodGlow)" stroke-linecap="round"/>

    <!-- TEIAS DOS CANTOS -->
    <g stroke="url(#vampGlow)" stroke-width="1.1" opacity="0.55" fill="none">
      <line x1="10" y1="10" x2="160" y2="10"/><line x1="10" y1="10" x2="140" y2="60"/><line x1="10" y1="10" x2="90" y2="110"/><line x1="10" y1="10" x2="40" y2="140"/><line x1="10" y1="10" x2="10" y2="160"/>
      <path d="M 40 10 Q 32 22 25 28 Q 18 32 10 40"/><path d="M 70 10 Q 56 38 43 51 Q 28 58 10 70"/><path d="M 100 10 Q 81 50 60 72 Q 38 82 10 100"/><path d="M 130 10 Q 106 63 76 92 Q 47 104 10 120"/><path d="M 160 10 Q 130 78 90 110 Q 55 125 10 145"/>

      <line x1="990" y1="10" x2="840" y2="10"/><line x1="990" y1="10" x2="860" y2="60"/><line x1="990" y1="10" x2="910" y2="110"/><line x1="990" y1="10" x2="960" y2="140"/><line x1="990" y1="10" x2="990" y2="160"/>
      <path d="M 960 10 Q 968 22 975 28 Q 982 32 990 40"/><path d="M 930 10 Q 944 38 957 51 Q 972 58 990 70"/><path d="M 900 10 Q 919 50 940 72 Q 962 82 990 100"/><path d="M 870 10 Q 894 63 924 92 Q 953 104 990 120"/><path d="M 840 10 Q 870 78 910 110 Q 945 125 990 145"/>
    </g>

    <!-- ARANHAS E FIO DE TEIA ANCORADOS -->
    <g>
      <line class="thread-right" x1="860" y1="10" x2="860" y2="75" stroke="#FF0055" stroke-width="1.2" opacity="0.9"/>
      <g class="spider-hanging">
        <g transform="translate(860, 75)">
          <g stroke="#FF0055" stroke-width="1.2" fill="none" stroke-linecap="round">
            <path d="M 0 -2 Q -10 -12 -16 -4"/><path d="M 0 -1 Q -12 -6 -18 2"/><path d="M 0 1 Q -12 6 -17 10"/><path d="M 0 3 Q -9 12 -13 18"/>
            <path d="M 0 -2 Q 10 -12 16 -4"/><path d="M 0 -1 Q 12 -6 18 2"/><path d="M 0 1 Q 12 6 17 10"/><path d="M 0 3 Q 9 12 13 18"/>
          </g>
          <circle cx="0" cy="-3" r="3" fill="#1A0217" stroke="#FF0033" stroke-width="1"/>
          <ellipse cx="0" cy="5" rx="4.5" ry="6" fill="#0A0008" stroke="#FF0033" stroke-width="1.2"/>
          <polygon points="0,2 -2,5 2,5 0,8 -2,5 2,5" fill="#FF0033" filter="url(#bloodGlow)"/>
        </g>
      </g>
    </g>

    <g>
      <line class="thread-left" x1="140" y1="10" x2="140" y2="50" stroke="#8000FF" stroke-width="1.1" opacity="0.85"/>
      <g class="spider-hanging-left">
        <g transform="translate(140, 50)">
          <g stroke="#8000FF" stroke-width="1" fill="none">
            <path d="M 0 -2 Q -7 -8 -11 -2"/><path d="M 0 0 Q -9 0 -12 5"/><path d="M 0 2 Q -7 8 -10 12"/>
            <path d="M 0 -2 Q 7 -8 11 -2"/><path d="M 0 0 Q 9 0 12 5"/><path d="M 0 2 Q 7 8 10 12"/>
          </g>
          <circle cx="0" cy="-2" r="2" fill="#8000FF"/>
          <ellipse cx="0" cy="3" rx="3" ry="4" fill="#050208" stroke="#8000FF" stroke-width="1"/>
        </g>
      </g>
    </g>

    <!-- Nós Laterais -->
    <g transform="translate(180, 75)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#FF0055" stroke-width="1.2"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#FF0055" stroke-width="1.2"/>
      <circle class="node" cx="0" cy="0" r="3" fill="#FF0033" filter="url(#bloodGlow)"/>
    </g>
    <g transform="translate(820, 185)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#8000FF" stroke-width="1.2"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#8000FF" stroke-width="1.2"/>
      <circle class="node" cx="0" cy="0" r="3" fill="#8000FF" filter="url(#bloodGlow)"/>
    </g>

    <!-- Marcadores de Canto HUD -->
    <path d="M 28 42 L 42 28 M 24 46 L 46 24" stroke="#FF0055" stroke-width="1" opacity="0.6"/>
    <path d="M 972 218 L 958 232 M 976 214 L 954 236" stroke="#8000FF" stroke-width="1" opacity="0.6"/>

    <!-- CONTEÚDO PRINCIPAL (TEXTOS) -->
    <g class="t1">
      <g class="title-glitch" filter="url(#darkShadow)">
        <text x="50" y="142" fill="none" stroke="url(#vampGlow)" stroke-width="6" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="54" font-weight="900" letter-spacing="7" opacity="0.75" filter="url(#bloodGlow)">KRYPTON</text>
        <text x="50" y="142" fill="url(#gothicText)" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="54" font-weight="900" letter-spacing="7">KRYPTON</text>
        <text x="50" y="142" fill="none" stroke="#FF0033" stroke-width="0.8" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="54" font-weight="900" letter-spacing="7" opacity="0.85">KRYPTON</text>
      </g>
    </g>

    <!-- Subtitle Badge -->
    <g class="t2">
      <path d="M 365 106 H 615 L 605 130 H 355 Z" fill="url(#gothicBadgeBg)" stroke="#FF0055" stroke-width="1" opacity="0.85"/>
      <text x="372" y="122" fill="#FF0055" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="1.5">† GRAPHICS &amp; DESKTOP DEV †</text>
    </g>

    <!-- Linha de Terminal Geek -->
    <text class="t3" x="52" y="174" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.5">
      <tspan fill="#FF0055" font-weight="bold">krypton@arch</tspan>:<tspan fill="#8000FF">~$</tspan> SYS: <tspan fill="#E2E8F0">ARCH_LINUX</tspan> // CORE: <tspan fill="#FF0033">C++ / RUST</tspan> // IDE: <tspan fill="#D946EF">ZED</tspan> // API: <tspan fill="#FF0055">VULKAN_NATIVE</tspan><tspan class="cursor-blink" fill="#FF0033">_</tspan>
    </text>

    <!-- Telemetria Direita -->
    <g font-family="'Courier New', monospace" font-size="11" text-anchor="end">
      <text class="t4" x="940" y="112" fill="#64748B">ECOSYSTEM: <tspan fill="#FF0055" font-weight="bold">ANIHUB // AURA</tspan></text>
      <text class="t5" x="940" y="132" fill="#64748B">STATUS: <tspan fill="#00FF66" font-weight="bold">[DARK_MODE_ACTIVE]</tspan></text>
      <text class="t6" x="940" y="154" fill="url(#vampGlow)" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="bold" letter-spacing="1">"ACCURACY IS NOT ARROGANCE"</text>
    </g>
  </g>
</svg>
