<svg id="banner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%"
     role="img" aria-labelledby="bnTitle bnDesc" preserveAspectRatio="xMidYMid meet">
  <title id="bnTitle">KRYPTON — Graphics &amp; Desktop Dev</title>
  <desc id="bnDesc">Selo cyber-gótico: placa chanfrada com grade HUD, teias de aranha rotativas, duas aranhas penduradas, feixe de varredura vertical e o nome KRYPTON com aberração cromática, seguido de uma linha de terminal e telemetria à direita.</desc>

  <defs>
    <!-- Gradiente-estopa da marca (crimson → violeta), agora em sRGB -->
    <linearGradient id="vamp" x1="0" y1="0" x2="1" y2="1" color-interpolation="sRGB">
      <stop offset="0" stop-color="#FF2E4D">
        <animate attributeName="stop-color" values="#FF2E4D;#7B3BFF;#FF5C7A;#FF2E4D" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".5" stop-color="#7B3BFF">
        <animate attributeName="stop-color" values="#7B3BFF;#FF2E4D;#7B3BFF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#C4173F">
        <animate attributeName="stop-color" values="#C4173F;#9B4DFF;#FF2E4D;#C4173F" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Tinta do wordmark: branco → cinza cinzentento → sangue -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#E7E3ED"/>
      <stop offset="1" stop-color="#8E1B33"/>
    </linearGradient>

    <!-- Micro-escada da tag -->
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7B3BFF" stop-opacity=".14"/>
    </linearGradient>

    <!-- Corpo da placa anodizada -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14121B"/>
      <stop offset=".45" stop-color="#0A0A0E"/>
      <stop offset="1" stop-color="#0D0C13"/>
    </linearGradient>

    <!-- Vinheta -->
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>

    <!-- Feixe de varredura -->
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B3BFF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#FF2E4D" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#FF2E4D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7B3BFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Véu de legibilidade atrás do texto -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08080A" stop-opacity=".96"/>
      <stop offset=".62" stop-color="#08080A" stop-opacity=".72"/>
      <stop offset="1" stop-color="#08080A" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="plateClip">
      <path d="M35 10 H965 L990 35 V225 L965 250 H35 L10 225 V35 Z"/>
    </clipPath>

    <!-- Grade HUD, agora com módulo 40 e tick a cada interseção -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#EDE9F1" stroke-width=".5" opacity=".05"/>
      <path d="M0 40 L40 0" fill="none" stroke="#FF2E4D" stroke-width=".5" opacity=".035"/>
      <circle cx="40" cy="40" r="1.1" fill="#FF2E4D" opacity=".22"/>
    </pattern>

    <!-- Glow: duas passadas, sempre em sRGB (evita o brilho fosco do linearRGB) -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b1"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".9"/>
    </filter>

    <!-- Ruído de placa -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    </filter>

    <style>
      /* ——— entrada: o LED da placa acende ——— */
      @keyframes powerOn{0%{transform:scaleY(.4);opacity:0}12%{opacity:1}100%{transform:scaleY(1);opacity:0}}
      .power{transform-box:fill-box;transform-origin:center;animation:powerOn 1.4s cubic-bezier(.16,1,.3,1) forwards}

      @keyframes settle{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      .r1{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) .35s forwards}
      .r2{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) .5s forwards}
      .r3{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) .64s forwards}
      .r4{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) .78s forwards}
      .r5{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) .92s forwards}
      .r6{opacity:0;animation:settle .7s cubic-bezier(.16,1,.3,1) 1.06s forwards}

      /* ——— moldura desenhada ——— */
      @keyframes draw{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
      .draw{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.8s cubic-bezier(.16,1,.3,1) .2s forwards}

      /* ——— telemetria / pacotes ——— (deslocamentos múltiplos do período do dash => loop sem salto) */
      @keyframes lane{to{stroke-dashoffset:-32}}
      .lane-dash{animation:lane 1.6s linear infinite}
      @keyframes packet{0%{stroke-dashoffset:628}100%{stroke-dashoffset:-628}}
      .packet{stroke-dasharray:46 268;animation:packet 3.6s linear infinite}

      /* ——— teias ——— */
      @keyframes spin{to{transform:rotate(360deg)}}
      .web-a{transform-box:view-box;transform-origin:320px 130px;animation:spin 120s linear infinite}
      .web-b{transform-box:view-box;transform-origin:680px 130px;animation:spin 150s linear infinite reverse}

      /* ——— aranhas ——— */
      @keyframes hangR{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(5deg) translateY(24px)}65%{transform:rotate(-4deg) translateY(8px)}}
      @keyframes thR{0%,100%{transform:rotate(0) scaleY(1)}30%{transform:rotate(5deg) scaleY(1.45)}65%{transform:rotate(-4deg) scaleY(1.12)}}
      .hang-r{transform-box:view-box;transform-origin:860px 10px;animation:hangR 9s ease-in-out infinite}
      .thr-r{transform-box:view-box;transform-origin:860px 10px;animation:thR 9s ease-in-out infinite}

      @keyframes hangL{0%,100%{transform:rotate(0) translateY(0)}40%{transform:rotate(-6deg) translateY(17px)}75%{transform:rotate(5deg) translateY(-6px)}}
      @keyframes thL{0%,100%{transform:rotate(0) scaleY(1)}40%{transform:rotate(-6deg) scaleY(1.4)}75%{transform:rotate(5deg) scaleY(.86)}}
      .hang-l{transform-box:view-box;transform-origin:140px 10px;animation:hangL 7.5s ease-in-out infinite}
      .thr-l{transform-box:view-box;transform-origin:140px 10px;animation:thL 7.5s ease-in-out infinite}

      /* ——— nós ——— */
      @keyframes node{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.5);opacity:1}}
      .node{transform-box:fill-box;transform-origin:center;animation:node 2.4s ease-in-out infinite}

      /* ——— aberração cromática do wordmark ——— */
      @keyframes chromaA{
        0%,88%,100%{transform:translate(0,0);opacity:.42}
        89%{transform:translate(-3px,1px);opacity:.95}
        91%{transform:translate(2.5px,-1.5px);opacity:.85}
        93%{transform:translate(-1.5px,.5px);opacity:.9}
        95%{transform:translate(0,0);opacity:.42}
      }
      @keyframes chromaB{
        0%,88%,100%{transform:translate(0,0);opacity:.36}
        89.5%{transform:translate(3.5px,-1px);opacity:.9}
        92%{transform:translate(-2.5px,1.5px);opacity:.8}
        94%{transform:translate(1px,0);opacity:.45}
        97%{transform:translate(0,0);opacity:.36}
      }
      .wm-a{animation:chromaA 7s ease-in-out infinite}
      .wm-b{animation:chromaB 7s ease-in-out infinite .12s}

      /* ——— varredura ——— */
      @keyframes sweep{0%{transform:translateY(-40px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(300px);opacity:0}}
      .beam{animation:sweep 9s cubic-bezier(.45,0,.55,1) infinite}

      /* ——— cursor ——— */
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .cur{animation:blink 1s step-end infinite}
    </style>
  </defs>

  <g clip-path="url(#plateClip)">
    <!-- corpo da placa -->
    <path d="M35 10 H965 L990 35 V225 L965 250 H35 L10 225 V35 Z" fill="url(#sheen)"/>
    <rect x="10" y="10" width="980" height="240" fill="url(#grid)"/>
    <rect x="10" y="10" width="980" height="240" fill="url(#vig)"/>
    <rect x="10" y="10" width="980" height="240" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>

    <!-- borda do bezel -->
    <path d="M35 10 H965 L990 35 V225 L965 250 H35 L10 225 V35 Z" fill="none" stroke="#231F2E" stroke-width="1.5"/>
    <path d="M43 21 H957 L979 43 V217 L957 239 H43 L21 217 V43 Z" fill="none" stroke="#7B3BFF" stroke-width=".75" opacity=".35"/>

    <!-- feixe de varredura -->
    <rect class="beam" x="10" y="-6" width="980" height="34" fill="url(#beamG)" style="mix-blend-mode:screen"/>

    <!-- teias radiais de fundo -->
    <g class="web web-a" fill="none" stroke="url(#vamp)" stroke-width="1.1" opacity=".17">
      <path d="M320 130 L170 20 M320 130 L320 10 M320 130 L470 20 M320 130 L500 130 M320 130 L470 240 M320 130 L320 250 M320 130 L170 240 M320 130 L140 130"/>
      <path d="M320 100 L362 107 L375 130 L362 153 L320 160 L278 153 L265 130 L278 107 Z"/>
      <path d="M320 70 L390 82 L410 130 L390 178 L320 190 L250 178 L230 130 L250 82 Z"/>
      <path d="M320 40 L418 57 L445 130 L418 203 L320 220 L222 203 L195 130 L222 57 Z"/>
      <path d="M320 10 L446 32 L480 130 L446 228 L320 250 L194 228 L160 130 L194 32 Z"/>
    </g>
    <g class="web web-b" fill="none" stroke="url(#vamp)" stroke-width="1.1" opacity=".15">
      <path d="M680 130 L530 20 M680 130 L680 10 M680 130 L830 20 M680 130 L860 130 M680 130 L830 240 M680 130 L680 250 M680 130 L530 240 M680 130 L500 130"/>
      <path d="M680 100 L722 107 L735 130 L722 153 L680 160 L638 153 L625 130 L638 107 Z"/>
      <path d="M680 70 L750 82 L770 130 L750 178 L680 190 L610 178 L590 130 L610 82 Z"/>
      <path d="M680 40 L778 57 L805 130 L778 203 L680 220 L582 203 L555 130 L582 57 Z"/>
      <path d="M680 10 L806 32 L840 130 L806 228 L680 250 L554 228 L520 130 L554 32 Z"/>
    </g>

    <!-- nervuras entre as teias -->
    <path d="M320 130 H680" stroke="#FF2E4D" stroke-width=".8" stroke-dasharray="3 7" opacity=".3"/>
    <path d="M445 130 L500 22 L555 130" fill="none" stroke="#7B3BFF" stroke-width=".7" stroke-dasharray="2 5" opacity=".3"/>
    <path d="M445 130 L500 238 L555 130" fill="none" stroke="#7B3BFF" stroke-width=".7" stroke-dasharray="2 5" opacity=".3"/>

    <!-- véu de legibilidade (fica ABAIXO das faixas para não apagá-las) -->
    <rect x="10" y="86" width="700" height="72" fill="url(#scrim)"/>
    <rect x="10" y="158" width="740" height="58" fill="url(#scrim)" opacity=".88"/>

    <!-- faixas de telemetria -->
    <g>
      <line class="lane-dash" x1="44" y1="75" x2="956" y2="75" stroke="url(#vamp)" stroke-width="1" stroke-dasharray="4 12" opacity=".32"/>
      <line class="packet" x1="44" y1="75" x2="956" y2="75" stroke="#FF2E4D" stroke-width="1.6" filter="url(#glow)"/>
      <line class="lane-dash" x1="44" y1="185" x2="956" y2="185" stroke="url(#vamp)" stroke-width="1" stroke-dasharray="4 12" opacity=".32"/>
      <line class="packet" x1="956" y1="185" x2="44" y2="185" stroke="#9B4DFF" stroke-width="1.6" filter="url(#glow)"/>
    </g>

    <!-- teias de canto -->
    <g class="cornerweb" fill="none" stroke="url(#vamp)" stroke-width="1" opacity=".5">
      <path d="M10 10 H160 M10 10 L140 60 M10 10 L90 110 M10 10 L40 140 M10 10 V160"/>
      <path d="M40 10 Q32 22 25 28 Q18 32 10 40"/>
      <path d="M70 10 Q56 38 43 51 Q28 58 10 70"/>
      <path d="M100 10 Q81 50 60 72 Q38 82 10 100"/>
      <path d="M130 10 Q106 63 76 92 Q47 104 10 120"/>
      <path d="M160 10 Q130 78 90 110 Q55 125 10 145"/>
      <path d="M990 10 H840 M990 10 L860 60 M990 10 L910 110 M990 10 L960 140 M990 10 V160"/>
      <path d="M960 10 Q968 22 975 28 Q982 32 990 40"/>
      <path d="M930 10 Q944 38 957 51 Q972 58 990 70"/>
      <path d="M900 10 Q919 50 940 72 Q962 82 990 100"/>
      <path d="M870 10 Q894 63 924 92 Q953 104 990 120"/>
      <path d="M840 10 Q870 78 910 110 Q945 125 990 145"/>
    </g>

    <!-- aranha direita -->
    <g class="spidergrp">
      <line class="thr-r" x1="860" y1="10" x2="860" y2="72" stroke="#FF2E4D" stroke-width="1.1" opacity=".9"/>
      <g class="hang-r">
        <g transform="translate(860,74)" stroke="#FF2E4D" stroke-width="1.1" fill="none" stroke-linecap="round">
          <path d="M0 -2 Q-10 -12 -16 -4 M0 -1 Q-12 -6 -18 2 M0 1 Q-12 6 -17 10 M0 3 Q-9 12 -13 18"/>
          <path d="M0 -2 Q10 -12 16 -4 M0 -1 Q12 -6 18 2 M0 1 Q12 6 17 10 M0 3 Q9 12 13 18"/>
          <circle cx="0" cy="-3" r="3" fill="#17031A" stroke="#FF2E4D"/>
          <ellipse cx="0" cy="5" rx="4.5" ry="6" fill="#0A0009" stroke="#FF2E4D" stroke-width="1.2"/>
          <path d="M0 2 L-2 5 H2 Z" fill="#FF2E4D" stroke="none" filter="url(#glow)"/>
        </g>
      </g>
    </g>

    <!-- aranha esquerda -->
    <g class="spidergrp">
      <line class="thr-l" x1="140" y1="10" x2="140" y2="48" stroke="#9B4DFF" stroke-width="1" opacity=".85"/>
      <g class="hang-l">
        <g transform="translate(140,50)" stroke="#9B4DFF" stroke-width="1" fill="none">
          <path d="M0 -2 Q-7 -8 -11 -2 M0 0 Q-9 0 -12 5 M0 2 Q-7 8 -10 12"/>
          <path d="M0 -2 Q7 -8 11 -2 M0 0 Q9 0 12 5 M0 2 Q7 8 10 12"/>
          <circle cx="0" cy="-2" r="2" fill="#9B4DFF" stroke="none"/>
          <ellipse cx="0" cy="3" rx="3" ry="4" fill="#08080A" stroke="#9B4DFF"/>
        </g>
      </g>
    </g>

    <!-- nós radiais -->
    <g transform="translate(180,75)">
      <path d="M-8 0 H8 M0 -8 V8" stroke="#FF2E4D" stroke-width="1" opacity=".8"/>
      <circle class="node" r="3" fill="#FF2E4D" filter="url(#glow)"/>
    </g>
    <g transform="translate(820,185)">
      <path d="M-8 0 H8 M0 -8 V8" stroke="#9B4DFF" stroke-width="1" opacity=".8"/>
      <circle class="node" r="3" fill="#9B4DFF" filter="url(#glow)" style="animation-delay:.9s"/>
    </g>

    <!-- marcas HUD -->
    <path d="M28 42 L42 28 M24 46 L46 24" stroke="#FF2E4D" stroke-width=".9" opacity=".5"/>
    <path d="M972 218 L958 232 M976 214 L954 236" stroke="#9B4DFF" stroke-width=".9" opacity=".5"/>
  </g>

  <!-- moldura neon chanfrada, desenhada por cima -->
  <path class="draw" d="M10 75 V35 L35 10 H262" fill="none" stroke="url(#vamp)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  <path class="draw" d="M990 185 V225 L965 250 H738" fill="none" stroke="url(#vamp)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-delay:.35s"/>

  <!-- ======= CONTEÚDO ======= -->

  <!-- wordmark -->
  <g class="r1" filter="url(#shadow)">
    <text class="wm-a" x="50" y="142" fill="none" stroke="#7B3BFF" stroke-width="5" opacity=".42" filter="url(#glow)"
          font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="900" letter-spacing="3">KRYPTON</text>
    <text class="wm-b" x="50" y="142" fill="none" stroke="#FF2E4D" stroke-width="5" opacity=".36" filter="url(#glow)"
          font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="900" letter-spacing="3">KRYPTON</text>
    <text x="50" y="142" fill="url(#ink)" font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="900" letter-spacing="3">KRYPTON</text>
    <text x="50" y="142" fill="none" stroke="#FFFFFF" stroke-width=".6" opacity=".45" font-family="'Cinzel', Georgia, serif" font-size="54" font-weight="900" letter-spacing="3">KRYPTON</text>
  </g>

  <!-- tag de subtítulo -->
  <g class="r2">
    <path d="M378 107 H630 L622 131 H370 Z" fill="url(#tag)" stroke="#FF2E4D" stroke-width=".9" opacity=".9"/>
    <rect x="370" y="107" width="3" height="24" fill="#FF2E4D"/>
    <text x="388" y="123.5" fill="#FF6B85" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.9">GRAPHICS &amp; DESKTOP DEV</text>
  </g>

  <!-- linha de terminal -->
  <text class="r3" x="52" y="205" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing=".4" fill="#A79FB4">
    <tspan fill="#FF2E4D" font-weight="700">krypton@arch</tspan><tspan fill="#8A8595">:</tspan><tspan fill="#9B4DFF">~$</tspan>
    <tspan fill="#8A8595">SYS:</tspan> <tspan fill="#EDE9F1">ARCH_LINUX</tspan> <tspan fill="#8A8595">//</tspan>
    <tspan fill="#8A8595">CORE:</tspan> <tspan fill="#FF2E4D">C++ / RUST</tspan> <tspan fill="#8A8595">//</tspan>
    <tspan fill="#8A8595">IDE:</tspan> <tspan fill="#C084FC">ZED</tspan> <tspan fill="#8A8595">//</tspan>
    <tspan fill="#8A8595">API:</tspan> <tspan fill="#FF6B85">VULKAN_NATIVE</tspan><tspan class="cur" fill="#FF2E4D">_</tspan>
  </text>

  <!-- telemetria -->
  <g text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing=".4">
    <text class="r4" x="940" y="110" fill="#8A8595">ECOSYSTEM: <tspan fill="#FF2E4D" font-weight="700">ANIHUB // AURA</tspan></text>
    <text class="r5" x="940" y="130" fill="#8A8595">STATUS: <tspan fill="#46FFA8" font-weight="700">[DARK_MODE_ACTIVE]</tspan></text>
    <text class="r6" x="940" y="154" fill="url(#vamp)" font-family="'Cinzel', Georgia, serif" font-size="12.5" font-weight="600" letter-spacing="1.2">“ACCURACY IS NOT ARROGANCE”</text>
  </g>

  <!-- flash de energização -->
  <rect class="power" x="10" y="128" width="980" height="3" fill="#FFFFFF" opacity=".8" filter="url(#glow)"/>
</svg>
