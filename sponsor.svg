<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Filtro de Brilho Gótico Crimson -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradiente da Moldura Principal -->
    <linearGradient id="gothicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="25%" stop-color="#3a000a" />
      <stop offset="50%" stop-color="#800020" />
      <stop offset="75%" stop-color="#2a0006" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Gradiente do Fundo (Glassmorphism Escuro) -->
    <radialGradient id="gothicBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0208" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050103" stop-opacity="0.85" />
    </radialGradient>

    <!-- Gradiente do Texto -->
    <linearGradient id="textGothic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e6e6e6" />
      <stop offset="100%" stop-color="#ff99a8" />
    </linearGradient>

    <!-- Gradiente da Aranha -->
    <linearGradient id="spiderBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="50%" stop-color="#0f0f14" />
      <stop offset="100%" stop-color="#800014" />
    </linearGradient>

    <style>
      .gothic-btn {
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .gothic-btn:hover {
        transform: scale(1.03);
      }

      /* Animação do Pulso da Teia */
      .web-pulse {
        stroke-dasharray: 8 6;
        animation: webFlow 5s linear infinite;
      }
      @keyframes webFlow {
        0% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: -50; opacity: 0.3; }
      }

      /* Animação da Aranha Pendurada */
      .spider-drop {
        animation: spiderHang 7s ease-in-out infinite;
        transform-origin: 520px 40px;
      }
      @keyframes spiderHang {
        0%, 100% { transform: translateY(0px); }
        35% { transform: translateY(75px); }
        70% { transform: translateY(20px); }
      }

      /* Movimento das Patas da Aranha */
      .leg-l {
        animation: wiggleL 2s ease-in-out infinite alternate;
        transform-origin: 520px 145px;
      }
      .leg-r {
        animation: wiggleR 2s ease-in-out infinite alternate;
        transform-origin: 520px 145px;
      }
      @keyframes wiggleL {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-8deg); }
      }
      @keyframes wiggleR {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(8deg); }
      }

      /* Aura Vermelha do Botão */
      .glow-border {
        animation: gothicAura 3s ease-in-out infinite alternate;
      }
      @keyframes gothicAura {
        0% { opacity: 0.4; filter: drop-shadow(0 0 5px #ff0033); }
        100% { opacity: 0.9; filter: drop-shadow(0 0 18px #ff0055); }
      }
    </style>
  </defs>

  <!-- Container Principal -->
  <g class="gothic-btn">

    <!-- 1. Glow Neon de Fundo -->
    <path 
      d="M 140 80 L 560 80 L 620 140 L 620 260 L 560 320 L 140 320 L 80 260 L 80 140 Z" 
      fill="none" 
      stroke="#ff0033" 
      stroke-width="3" 
      class="glow-border"
      filter="url(#crimsonGlow)"
    />

    <!-- 2. Corpo do Botão Gótico (Chanfrado Octogonal) -->
    <path 
      d="M 140 80 L 560 80 L 620 140 L 620 260 L 560 320 L 140 320 L 80 260 L 80 140 Z" 
      fill="url(#gothicBg)" 
      stroke="url(#gothicBorder)" 
      stroke-width="4"
    />

    <!-- Moldura Interna Ornamental -->
    <path 
      d="M 148 90 L 552 90 L 610 148 L 610 252 L 552 310 L 148 310 L 90 252 L 90 148 Z" 
      fill="none" 
      stroke="#ff0033" 
      stroke-width="1" 
      opacity="0.4"
    />

    <!-- 3. TEIAS DE ARANHA NOS CANTOS (Vetores Detalhados) -->
    <g stroke="#ff3366" stroke-width="1.2" fill="none" class="web-pulse">
      <!-- Canto Superior Esquerdo -->
      <path d="M 80 140 L 180 80 M 80 180 L 220 80 M 80 220 L 260 80" opacity="0.4" />
      <path d="M 110 125 Q 125 110 140 95 M 130 155 Q 160 130 185 105 M 150 185 Q 190 150 225 115" />

      <!-- Canto Inferior Direito -->
      <path d="M 620 220 L 520 320 M 620 180 L 480 320 M 620 140 L 440 320" opacity="0.4" />
      <path d="M 590 235 Q 575 250 560 265 M 570 205 Q 540 230 515 255 M 550 175 Q 510 210 475 245" />
    </g>

    <!-- 4. DETALHES GÓTICOS / ESPINHOS NOS CANTOS -->
    <g fill="#ff0033">
      <polygon points="140,80 155,70 150,85" />
      <polygon points="560,80 545,70 550,85" />
      <polygon points="140,320 155,330 150,315" />
      <polygon points="560,320 545,330 550,315" />
    </g>

    <!-- 5. ÍCONE GÓTICO: Coração Espinhoso com Asas de Morcego -->
    <g transform="translate(190, 200)">
      <!-- Asas de Morcego Estilizadas -->
      <path d="M -10 -5 Q -30 -35 -60 -15 Q -45 5 -35 25 Q -20 15 -10 5 Z" fill="#3a000f" stroke="#ff0044" stroke-width="1.5"/>
      <path d="M 10 -5 Q 30 -35 60 -15 Q 45 5 35 25 Q 20 15 10 5 Z" fill="#3a000f" stroke="#ff0044" stroke-width="1.5"/>
      
      <!-- Coração Sangrento -->
      <path 
        d="M 0 22 C -25 -5 -30 -25 0 -35 C 30 -25 25 -5 0 22 Z" 
        fill="url(#gothicBorder)" 
        stroke="#ffffff" 
        stroke-width="1.5"
        filter="url(#crimsonGlow)"
      />
    </g>

    <!-- 6. TEXTO "SPONSOR" (Fonte Serifada Gótica) -->
    <text 
      x="390" y="213" 
      fill="url(#textGothic)" 
      font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" 
      font-size="44" 
      font-weight="900" 
      letter-spacing="7"
      text-anchor="middle" 
      dominant-baseline="central"
      stroke="#1a0005"
      stroke-width="1.5"
      filter="drop-shadow(2px 4px 10px #000000)"
    >
      SPONSOR
    </text>

    <!-- 7. ARANHA ANIMADA E FIO DE SEDA -->
    <g class="spider-drop">
      <!-- Fio de Seda -->
      <line x1="520" y1="80" x2="520" y2="145" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" />

      <!-- Corpo da Aranha -->
      <g transform="translate(0, 0)">
        <!-- Patas Esquerda -->
        <g class="leg-l" stroke="#ff0044" stroke-width="1.8" fill="none">
          <path d="M 520 142 Q 500 130 490 140" />
          <path d="M 520 145 Q 495 140 485 152" />
          <path d="M 520 148 Q 498 155 488 165" />
          <path d="M 520 150 Q 505 165 495 175" />
        </g>

        <!-- Patas Direita -->
        <g class="leg-r" stroke="#ff0044" stroke-width="1.8" fill="none">
          <path d="M 520 142 Q 540 130 550 140" />
          <path d="M 520 145 Q 545 140 555 152" />
          <path d="M 520 148 Q 542 155 552 165" />
          <path d="M 520 150 Q 535 165 545 175" />
        </g>

        <!-- Abdômen e Cefalotórax -->
        <ellipse cx="520" cy="155" rx="9" ry="12" fill="url(#spiderBody)" stroke="#ff0044" stroke-width="1" />
        <circle cx="520" cy="143" r="6" fill="#1a0005" stroke="#ff0044" stroke-width="1" />

        <!-- Olhos Brilhantes em Neon -->
        <circle cx="518" cy="141" r="1" fill="#ff0055" />
        <circle cx="522" cy="141" r="1" fill="#ff0055" />
        <circle cx="516" cy="143" r="0.8" fill="#ffffff" />
        <circle cx="524" cy="143" r="0.8" fill="#ffffff" />
      </g>
    </g>

  </g>
</svg>
